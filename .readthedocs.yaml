version: "2"

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"
    nodejs: "20"
  jobs:
    post_install:
      - cd docs && npm ci
    pre_build:
      - cd docs && npm run build:assets
      - cd docs && pybabel compile --directory=source/locale --domain=messages
      - cd docs && pybabel compile --directory=source/locale --domain=sphinx

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/source/conf.py
